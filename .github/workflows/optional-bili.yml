name: Optional Bilibili acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optional:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          dotnet publish src/BigFish.App -c Release -r win-x64 --self-contained true -p:BigFishDownloadRegion=cn -o artifacts/channels/cn
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          ./scripts/windows-acceptance.ps1 -Bili -Region cn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-bili-acceptance
          path: artifacts/acceptance
