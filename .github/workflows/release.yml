name: Publish two Windows EXEs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'compatibility/**'
      - 'Directory.Build.props'
      - 'BigFish.sln'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bigfish-release
  cancel-in-progress: false

jobs:
  windows-build-and-acceptance:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Run regression tests and publish two self-contained EXEs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test tests/BigFish.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Unit/integration tests failed' }
          New-Item -ItemType Directory -Force -Path release-downloads | Out-Null
          foreach ($region in @('cn', 'global')) {
            $label = if ($region -eq 'cn') { 'CN' } else { 'Global' }
            $output = "artifacts/channels/$region"
            dotnet publish src/BigFish.App -c Release -r win-x64 --self-contained true "-p:BigFishDownloadRegion=$region" -o $output
            if ($LASTEXITCODE -ne 0) { throw "Windows publish failed ($region)" }
            ./scripts/windows-acceptance.ps1 -Region $region
            if ($LASTEXITCODE -ne 0) { throw "Windows acceptance failed ($region)" }
            $source = Join-Path $output 'BigFish.exe'
            if (!(Test-Path $source) -or (Get-Item $source).Length -lt 1000000) { throw "Standalone EXE missing or too small ($region)" }
            Copy-Item $source "release-downloads/BigFish-$label.exe" -Force
          }
          $files = @(Get-ChildItem release-downloads -File)
          if ($files.Count -ne 2) { throw "Expected exactly two EXEs, found $($files.Count)" }
          $files | ForEach-Object { Write-Output "$($_.Name) SHA256=$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" }
      - uses: actions/upload-artifact@v4
        with:
          name: two-exe-downloads
          path: release-downloads/*.exe
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: windows-build-and-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: two-exe-downloads
          path: release-downloads
      - name: Check exactly two binaries and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v0.1.2
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release-downloads/BigFish-CN.exe
          test -s release-downloads/BigFish-Global.exe
          test "$(find release-downloads -maxdepth 1 -type f | wc -l)" -eq 2
          printf '%s\n' \
            'BigFish Installer 0.1.2 - Windows x64' \
            '' \
            '下载下方中国版或国际版 EXE，双击运行即可进入图形安装器。首次安装需要联网。' \
            '无需预装 .NET / Node.js / Python。' \
            '修复启动进度条绑定；直接在安装器填写 API Key；自动注册工作区。' \
            '' \
            '中国版：BigFish-CN.exe（国内下载镜像优先）。' \
            '国际版：BigFish-Global.exe（官方源优先）。' \
            '' \
            'Windows CI 已通过程序启动、真实 DSH/IM 安装、认证、重复安装及停止检查。' \
            '尚未完成人工扫码、真实模型调用及完整终端用户验收；程序尚未签名。' \
            '' \
            "构建提交：$SHA" \
            '' \
            'SHA-256 校验值：' > release-notes.md
          sha256sum release-downloads/BigFish-CN.exe release-downloads/BigFish-Global.exe >> release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving the existing tag and assets."
          else
            gh release create "$TAG" release-downloads/BigFish-CN.exe release-downloads/BigFish-Global.exe \
              --target "$SHA" --latest --title "BigFish Installer 0.1.2" --notes-file release-notes.md
          fi
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
